<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hi there!</title>
  <style>
    html {
      background: #f9fafb;
    }

    body {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      max-width: 80rem;
      min-height: 100vh;
      margin: 0 auto;
      padding: 4rem 2rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    h1 {
      margin: 0;
      font-size: 1.875rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #111827;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>hi there!</h1>
  <script>
    // Browsers expose internationalized hostnames only in ASCII form (xn--…)
    // and have no built-in decoder, so labels are decoded here per RFC 3492.
    function decodePunycode(input) {
      const base = 36;
      const tMin = 1;
      const tMax = 26;
      const skew = 38;
      const damp = 700;
      const delimiter = input.lastIndexOf("-");
      const output = delimiter > 0 ? [...input.slice(0, delimiter)].map((c) => c.codePointAt(0)) : [];
      let n = 128;
      let bias = 72;
      let i = 0;

      for (let pos = delimiter > 0 ? delimiter + 1 : 0; pos < input.length;) {
        const oldI = i;
        for (let w = 1, k = base; ; k += base) {
          const c = input.charCodeAt(pos++);
          const digit = c >= 48 && c < 58 ? c - 22 : c >= 97 && c < 123 ? c - 97 : c >= 65 && c < 91 ? c - 65 : base;
          // Also stops the loop at end of input, where charCodeAt returns NaN.
          if (digit >= base) throw new RangeError(`Invalid punycode: ${input}`);
          i += digit * w;
          const t = k <= bias ? tMin : k >= bias + tMax ? tMax : k - bias;
          if (digit < t) break;
          w *= base - t;
        }

        const length = output.length + 1;
        let delta = oldI === 0 ? Math.floor((i - oldI) / damp) : (i - oldI) >> 1;
        delta += Math.floor(delta / length);
        let k = 0;
        for (; delta > ((base - tMin) * tMax) >> 1; k += base) {
          delta = Math.floor(delta / (base - tMin));
        }
        bias = k + Math.floor(((base - tMin + 1) * delta) / (delta + skew));
        n += Math.floor(i / length);
        i %= length;
        output.splice(i++, 0, n);
      }

      return String.fromCodePoint(...output);
    }

    const hostname = location.hostname
      .split(".")
      .map((label) => (label.startsWith("xn--") ? decodePunycode(label.slice(4)) : label))
      .join(".") || document.title;

    document.querySelector("h1").textContent = hostname;
    document.title = hostname;
  </script>
</body>

</html>
